<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarah & Alex are Getting Married!</title>
 <!-- Correct way to link CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BACKGROUND MUSIC (Replace song.mp3 with your audio filename) -->
  <audio id="bg-music" src="song.mp3" loop></audio>

  <!-- COVER SCREEN OVERLAY -->
  <div id="cover" class="cover-overlay">
    <div class="cover-card">
      <p class="tagline">You Are Cordially Invited To The Wedding Of</p>
      <h1>Sarah & Alex</h1>
      <p class="date-preview">October 25, 2026</p>
      <button class="btn-main" onclick="openInvitation()">✉️ Open Invitation</button>
    </div>
  </div>

  <!-- MAIN SCROLLING CONTENT (Hidden until button is clicked) -->
  <main id="main-content" class="hidden">

    <!-- FLOATING MUSIC TOGGLE BUTTON -->
    <button id="music-btn" class="floating-music-btn" onclick="toggleMusic()">🎵 Pause Song</button>

    <!-- HERO SECTION -->
  <section class="hero" style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('./bg1.jpeg'); background-size: cover; background-position: center;">
    <!-- DETAILS SECTION -->
    <section class="details">
      <div class="glass-box">
        <h2>The Celebration</h2>
        <p><strong>Date:</strong> October 24, 2026</p>
        <p><strong>Time:</strong> 4:00 PM onwards</p>
        <p><strong>Venue:</strong> Grand Palace Gardens, Bengaluru</p>
        <a href="https://maps.google.com" target="_blank" class="btn-secondary">📍 View Location Map</a>
      </div>
    </section>

    <!-- RSVP SECTION -->
    <section class="rsvp">
      <div class="glass-box">
        <h2>RSVP</h2>
        <p>Please let us know if you can make it by September 1, 2026!</p>
        <a href="https://forms.google.com" target="_blank" class="btn-main">✉️ Click Here to RSVP</a>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
